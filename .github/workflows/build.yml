# Builds Aether automatically on GitHub's computers every time code is pushed.
#
# - "sounds":  builds the recorded instrument pack from public-domain (CC0) recordings with
#              tools/sounds/build_pack.py (kept in GitHub's cache until the builder changes).
# - "windows": compiles Aether, runs the tests, makes Setup.exe (with the instrument pack) and a
#              screenshot. Download Setup.exe from the run's page under "Artifacts".
# - "linux":   runs the tests again, plus the RealtimeSanitizer build that checks the
#              audio thread never allocates memory or takes locks.
#
# Pushing a tag like "v0.1.0" additionally publishes Setup.exe on the Releases page.

name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sounds:
    name: Recorded instrument pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Reuse the pack if the builder hasn't changed
        id: cache
        uses: actions/cache@v6
        with:
          path: pack/Sounds
          key: sounds-${{ hashFiles('tools/sounds/**') }}

      - name: Build the pack (downloads about 2 GB of recordings)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet soundfile numpy
          python3 tools/sounds/build_pack.py --work "$RUNNER_TEMP/sound-sources" --out pack/Sounds

      - name: Upload the pack for the Windows build
        uses: actions/upload-artifact@v7
        with:
          name: aether-sounds
          path: pack/Sounds
          if-no-files-found: error

  windows:
    name: Windows - build, test, Setup.exe
    needs: sounds
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Read version number
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -First 1).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup (if this machine doesn't have it)
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
                     "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe", "${env:ProgramFiles}\Inno Setup 7\ISCC.exe")
          if (-not ($paths | Where-Object { Test-Path $_ }) -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Get the recorded instrument pack
        uses: actions/download-artifact@v8
        with:
          name: aether-sounds
          path: build/sounds/Sounds

      - name: Build, test and make Setup.exe
        shell: cmd
        env:
          AETHER_SOUNDS: ${{ github.workspace }}\build\sounds\Sounds
        run: build-windows.bat

      - name: Take screenshots of Aether running on Windows
        shell: pwsh
        continue-on-error: true
        run: |
          # The start screen, then a project with two tracks (a copy of the test project).
          $demo = Join-Path $env:RUNNER_TEMP "Fixture Song"
          New-Item -ItemType Directory -Force -Path $demo | Out-Null
          Copy-Item "tests\fixtures\projects\v1-basic.aether" (Join-Path $demo "Fixture Song.aether")
          $runs = @(
            @{ Out = "aether-windows.png";         Args = @() },
            @{ Out = "aether-windows-project.png"; Args = @("`"$(Join-Path $demo 'Fixture Song.aether')`"") }
          )
          foreach ($run in $runs) {
            $out = Join-Path $PWD $run.Out
            $p = Start-Process -FilePath "build\windows-release\stage\Aether.exe" -ArgumentList ($run.Args + @("--screenshot", "`"$out`"")) -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Aether did not finish within 60 seconds" }
            if ($p.ExitCode -ne 0) { throw "Aether exited with code $($p.ExitCode)" }
          }

      # Uploaded without zipping, so it downloads directly as Aether-Setup-<version>.exe
      - name: Upload Setup.exe
        uses: actions/upload-artifact@v7
        with:
          path: build/installer/Aether-Setup-${{ steps.version.outputs.version }}.exe
          archive: false
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-windows
          path: aether-windows*.png
          if-no-files-found: ignore

  linux:
    name: Linux - tests and RealtimeSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-20 libclang-rt-20-dev \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev xvfb xauth

      - name: Build and run the tests
        run: |
          cmake --preset linux-debug
          cmake --build --preset linux-debug
          ctest --preset linux-debug

      - name: Take screenshots of Aether running on Linux
        continue-on-error: true
        run: |
          app=build/linux-debug/source/AetherApp_artefacts/Debug/Aether
          demo="$RUNNER_TEMP/Fixture Song"
          mkdir -p "$demo" && cp tests/fixtures/projects/v1-basic.aether "$demo/Fixture Song.aether"
          xvfb-run -a -s "-screen 0 1400x900x24" "$app" --screenshot "$PWD/aether-linux.png"
          xvfb-run -a -s "-screen 0 1400x900x24" "$app" "$demo/Fixture Song.aether" --screenshot "$PWD/aether-linux-project.png"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-linux
          path: aether-linux*.png
          if-no-files-found: ignore

      - name: Real-time safety tests (RealtimeSanitizer)
        run: |
          cmake --preset linux-rtsan
          cmake --build --preset linux-rtsan
          ctest --preset linux-rtsan

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, linux ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Setup.exe
        uses: actions/download-artifact@v8
        with:
          name: Aether-Setup-${{ needs.windows.outputs.version }}.exe
          path: dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
